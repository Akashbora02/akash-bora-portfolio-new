<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad1)" rx="16"/>
  <rect width="798" height="448" x="1" y="1" fill="none" stroke="#334155" stroke-width="1.5" rx="16"/>

  <!-- Grid Pattern -->
  <g opacity="0.15">
    <path d="M0 50 H800 M0 100 H800 M0 150 H800 M0 200 H800 M0 250 H800 M0 300 H800 M0 350 H800 M0 400 H800" stroke="#00E5FF" stroke-width="1"/>
    <path d="M50 0 V450 M100 0 V450 M150 0 V450 M200 0 V450 M250 0 V450 M300 0 V450 M350 0 V450 M400 0 V450 M450 0 V450 M500 0 V450 M550 0 V450 M600 0 V450 M650 0 V450 M700 0 V450 M750 0 V450" stroke="#00E5FF" stroke-width="1"/>
  </g>

  <!-- Connecting Lines -->
  <path d="M170 225 H270 M400 225 H490 M630 225 H680" stroke="#00E5FF" stroke-width="2.5" stroke-dasharray="6,6" opacity="0.8"/>
  <circle cx="220" cy="225" r="4" fill="#00E5FF" filter="url(#glow1)"/>
  <circle cx="445" cy="225" r="4" fill="#00E5FF" filter="url(#glow1)"/>

  <!-- Node 1: Git Repository -->
  <g transform="translate(60, 150)">
    <rect width="110" height="150" rx="12" fill="#111827" stroke="#F43F5E" stroke-width="2"/>
    <circle cx="55" cy="45" r="22" fill="#F43F5E" opacity="0.2"/>
    <path d="M55 35 V55 M45 42 L55 32 L65 42" stroke="#F43F5E" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="55" y="85" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Git Repo</text>
    <text x="55" y="105" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">GitHub / GitLab</text>
    <text x="55" y="130" fill="#00E5FF" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Manifests / Helm</text>
  </g>

  <!-- Node 2: Argo CD Controller -->
  <g transform="translate(270, 135)">
    <rect width="130" height="180" rx="12" fill="#111827" stroke="#FF9900" stroke-width="2.5" filter="url(#glow1)" opacity="0.2"/>
    <rect width="130" height="180" rx="12" fill="#111827" stroke="#FF9900" stroke-width="2"/>
    <circle cx="65" cy="45" r="24" fill="#FF9900" opacity="0.2"/>
    <polygon points="65,28 82,45 65,62 48,45" fill="none" stroke="#FF9900" stroke-width="2.5"/>
    <circle cx="65" cy="45" r="5" fill="#FF9900"/>
    <text x="65" y="90" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Argo CD</text>
    <text x="65" y="110" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">GitOps Engine</text>
    <rect x="15" y="130" width="100" height="26" rx="6" fill="#10B981" opacity="0.2"/>
    <text x="65" y="147" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Synced &amp; Healthy</text>
  </g>

  <!-- Node 3: AWS EKS Cluster -->
  <g transform="translate(490, 110)">
    <rect width="250" height="230" rx="16" fill="#111827" stroke="#00E5FF" stroke-width="2"/>
    <text x="125" y="35" fill="#00E5FF" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">AWS EKS Production Cluster</text>
    
    <!-- Microservices Pods -->
    <rect x="20" y="55" width="95" height="65" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="35" cy="73" r="5" fill="#38BDF8"/>
    <text x="47" y="77" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Auth Pod</text>
    <text x="67" y="102" fill="#10B981" font-family="system-ui, sans-serif" font-size="10">2 Replicas (HPA)</text>

    <rect x="135" y="55" width="95" height="65" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="150" cy="73" r="5" fill="#38BDF8"/>
    <text x="162" y="77" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">API Pod</text>
    <text x="182" y="102" fill="#10B981" font-family="system-ui, sans-serif" font-size="10">4 Replicas (HPA)</text>

    <rect x="20" y="135" width="210" height="75" rx="8" fill="#0F172A" stroke="#6366F1" stroke-width="1.5"/>
    <text x="35" y="157" fill="#A5B4FC" font-family="system-ui, sans-serif" font-size="11" font-weight="700">NGINX Ingress Controller</text>
    <text x="35" y="177" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">SSL Termination • Zero Downtime</text>
    <text x="35" y="195" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10">Auto-Scaling Nodes (2-4 Nodes)</text>
  </g>

  <!-- Top Badges -->
  <g transform="translate(60, 40)">
    <rect width="180" height="32" rx="16" fill="#00E5FF" fill-opacity="0.1" stroke="#00E5FF" stroke-width="1"/>
    <text x="90" y="21" fill="#00E5FF" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Zero-Downtime GitOps</text>
  </g>
  <g transform="translate(260, 40)">
    <rect width="180" height="32" rx="16" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-width="1"/>
    <text x="90" y="21" fill="#10B981" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🛡️ 1-Click Rollback Enabled</text>
  </g>
  <g transform="translate(460, 40)">
    <rect width="210" height="32" rx="16" fill="#F59E0B" fill-opacity="0.1" stroke="#F59E0B" stroke-width="1"/>
    <text x="105" y="21" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">📊 40% Faster Deployments</text>
  </g>
</svg>
